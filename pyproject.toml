[project]
name = "bi-chatbot"
version = "0.1.0"
description = "Chatbot de BI da Ease Labs"
requires-python = ">=3.12,<3.13"
dependencies = [
    "celery[redis]>=5.4",
    "django>=5.2,<5.3",
    "djangorestframework>=3.15",
    "gunicorn>=23.0",
    "openai>=1.50",
    "openpyxl>=3.1.5",
    # Só para validar e reduzir a imagem do anexo (ADR-0024): o custo da
    # imagem é proporcional à área, e reduzir antes de enviar corta dois
    # terços dos tokens.
    "pillow>=11.0",
    "psycopg2-binary>=2.9.10",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0",
    "sqlglot>=25.0",
    "whitenoise>=6.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
# Settings próprios da suíte: não carregam o bi/.env (credenciais reais) e
# usam sempre o Postgres local. Ver app/config/settings_test.py.
DJANGO_SETTINGS_MODULE = "config.settings_test"
pythonpath = ["app", "."]
testpaths = ["tests"]
filterwarnings = [
    # collectstatic só roda no build da imagem; localmente o diretório não
    # existe e o WhiteNoise avisa em toda requisição dos testes.
    "ignore:No directory at:UserWarning",
]
