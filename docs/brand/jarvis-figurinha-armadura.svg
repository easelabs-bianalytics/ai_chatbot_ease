<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="-4 -1 72 72">
  <!-- Figurinha do Jarvis com armadura (2026-09-25): homenagem ao "Jarvis"
       do Homem de Ferro com o NOSSO mascote (a cápsula, a viseira e o anel
       verde do app), não o capacete da Marvel. Fundo transparente e contorno
       branco, como as figurinhas do WhatsApp. -->
  <defs>
    <linearGradient id="vermelho" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#F0524F"/>
      <stop offset="0.45" stop-color="#C8202A"/>
      <stop offset="1" stop-color="#7A0E16"/>
    </linearGradient>
    <linearGradient id="ouro" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#FFE9A8"/>
      <stop offset="0.45" stop-color="#F1B941"/>
      <stop offset="1" stop-color="#B8771C"/>
    </linearGradient>
    <linearGradient id="viseira" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4FEFF"/>
      <stop offset="0.6" stop-color="#9BEBFF"/>
      <stop offset="1" stop-color="#43C4F0"/>
    </linearGradient>
    <radialGradient id="reator" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#B8F3FF"/>
      <stop offset="1" stop-color="#3FB8E8"/>
    </radialGradient>
    <linearGradient id="chama" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#A8EEFF"/>
      <stop offset="1" stop-color="#3FB8E8" stop-opacity="0"/>
    </linearGradient>
    <filter id="brilho" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="halo" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
    <filter id="sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0.9" stdDeviation="0.9" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- propulsores: ele está voando. Contorno branco, como o resto, para não
       sumir no fundo claro da conversa. -->
  <g stroke="#FFFFFF" stroke-width="3.2" stroke-linejoin="round" fill="#FFFFFF" filter="url(#sombra)">
    <path d="M 23.6 50 Q 26.5 49.2 29.4 50 Q 28.4 57.5 26.5 63.2 Q 24.6 57.5 23.6 50 Z"/>
    <path d="M 34.6 50 Q 37.5 49.2 40.4 50 Q 39.4 57.5 37.5 63.2 Q 35.6 57.5 34.6 50 Z"/>
  </g>
  <g>
    <ellipse cx="26.5" cy="54" rx="3.6" ry="5" fill="#5FD4FF" opacity="0.55" filter="url(#halo)"/>
    <ellipse cx="37.5" cy="54" rx="3.6" ry="5" fill="#5FD4FF" opacity="0.55" filter="url(#halo)"/>
    <path d="M 23.6 50 Q 26.5 49.2 29.4 50 Q 28.4 57.5 26.5 63.2 Q 24.6 57.5 23.6 50 Z" fill="#7FDCFF"/>
    <path d="M 34.6 50 Q 37.5 49.2 40.4 50 Q 39.4 57.5 37.5 63.2 Q 35.6 57.5 34.6 50 Z" fill="#7FDCFF"/>
    <path d="M 25.1 50.2 Q 26.5 49.8 27.9 50.2 Q 27.4 55 26.5 58.2 Q 25.6 55 25.1 50.2 Z" fill="#FFFFFF"/>
    <path d="M 36.1 50.2 Q 37.5 49.8 38.9 50.2 Q 38.4 55 37.5 58.2 Q 36.6 55 36.1 50.2 Z" fill="#FFFFFF"/>
  </g>

  <!-- contorno branco de figurinha, por trás de tudo -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" filter="url(#sombra)">
    <rect x="17" y="11.9" width="30" height="40.3" rx="15" stroke-width="5.2" fill="#FFFFFF"/>
    <g transform="rotate(-14 32 40)">
      <path d="M 7,40 A 25,8 0 0,1 57,40" stroke-width="5"/>
      <path d="M 7,40 A 25,8 0 0,0 57,40" stroke-width="4.4"/>
      <circle cx="44.5" cy="46.9" r="3.4" fill="#FFFFFF" stroke-width="2.4"/>
      <circle cx="16.4" cy="33.4" r="2.6" fill="#FFFFFF" stroke-width="2.4"/>
    </g>
  </g>

  <!-- anel de trás (o anel verde é a marca do Jarvis) -->
  <g transform="rotate(-14 32 40)">
    <path d="M 7,40 A 25,8 0 0,0 57,40" fill="none" stroke="#6ECC64" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>
    <circle cx="16.4" cy="33.4" r="2.2" fill="#6ECC64" stroke="#3A0A0E" stroke-width="1"/>
  </g>

  <!-- a armadura: a mesma cápsula do app, em vermelho -->
  <rect x="17" y="11.9" width="30" height="40.3" rx="15" fill="url(#vermelho)" stroke="#3A0A0E" stroke-width="1.6"/>
  <!-- placas laterais -->
  <path d="M 19.2 30 C 19.2 38 21 44.5 24 48.5" fill="none" stroke="#5E0A11" stroke-width="0.7" opacity="0.7"/>
  <path d="M 44.8 30 C 44.8 38 43 44.5 40 48.5" fill="none" stroke="#5E0A11" stroke-width="0.7" opacity="0.7"/>
  <ellipse cx="24.5" cy="17.5" rx="4" ry="2.2" fill="#FFFFFF" opacity="0.28" transform="rotate(-30 24.5 17.5)"/>

  <!-- placa dourada do rosto -->
  <path d="M 20.2 26 C 20.2 18.6 25.4 14.6 32 14.6 C 38.6 14.6 43.8 18.6 43.8 26 L 43.8 32.6
           C 43.8 37.2 40.4 40.3 36.2 40.8 L 27.8 40.8 C 23.6 40.3 20.2 37.2 20.2 32.6 Z"
        fill="url(#ouro)" stroke="#6E4210" stroke-width="0.8"/>
  <path d="M 26 17.2 C 28 16.3 36 16.3 38 17.2" fill="none" stroke="#FFF6D6" stroke-width="0.7" opacity="0.8"/>
  <path d="M 28.2 36.6 L 35.8 36.6" stroke="#8A5A14" stroke-width="0.8" stroke-linecap="round"/>

  <!-- viseira: a pílula do app, acesa -->
  <rect x="21.4" y="22.4" width="21.2" height="7.6" rx="3.8" fill="#26090C"/>
  <rect x="22.6" y="23.6" width="18.8" height="5.2" rx="2.6" fill="url(#viseira)" filter="url(#brilho)"/>
  <circle cx="37.6" cy="26.2" r="1.5" fill="#FFFFFF" filter="url(#brilho)"/>

  <!-- reator no peito -->
  <circle cx="32" cy="45.6" r="5.2" fill="#6FD9FF" opacity="0.45" filter="url(#halo)"/>
  <circle cx="32" cy="45.6" r="3.7" fill="#5B6574" stroke="#2A0709" stroke-width="0.8"/>
  <circle cx="32" cy="45.6" r="2.7" fill="url(#reator)" filter="url(#brilho)"/>
  <circle cx="32" cy="45.6" r="2.7" fill="none" stroke="#FFFFFF" stroke-width="0.35" stroke-dasharray="1.1 0.6" opacity="0.9"/>
  <circle cx="32" cy="45.6" r="1.3" fill="#FFFFFF"/>

  <!-- anel da frente, com o satélite -->
  <g transform="rotate(-14 32 40)">
    <path d="M 7,40 A 25,8 0 0,1 57,40" fill="none" stroke="#6ECC64" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="44.5" cy="46.9" r="2.9" fill="#6ECC64" stroke="#3A0A0E" stroke-width="1.1"/>
  </g>
</svg>
