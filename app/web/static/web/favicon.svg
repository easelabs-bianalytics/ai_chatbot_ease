<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Ícone do Jarvis 3.0 — opção H (docs/brand/jarvis-3.0-favicons.html,
       escolhida em 2026-10-06, depois de testar a G na prática): o close no
       rosto do mascote sobre o ladrilho lavanda claro. A viseira e o olho
       ocupam o ícone e o anel atravessa, então em 16 px ainda se lê
       "Jarvis"; o fundo claro combina com o login e a tela inicial.
       Medidas do mascote: docs/brand/README.md. -->
  <defs>
    <clipPath id="ladrilho"><rect width="64" height="64" rx="15"/></clipPath>
    <linearGradient id="corpo" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7C80F7"/>
      <stop offset="1" stop-color="#4A4DC4"/>
    </linearGradient>
    <linearGradient id="anel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4FB34A"/>
      <stop offset="1" stop-color="#A8F09E"/>
    </linearGradient>
    <filter id="luz" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="0.9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="#EEF0FF"/>
  <g clip-path="url(#ladrilho)">
    <g transform="translate(32 40) scale(1.75) translate(-32 -32)">
      <g transform="rotate(-14 32 40)">
        <path d="M 7,40 A 25,8 0 0,1 57,40" fill="none" stroke="#3E8F38" stroke-width="2.2" stroke-linecap="round" opacity="0.75"/>
      </g>
      <rect x="17" y="11.9" width="30" height="40.3" rx="15" fill="url(#corpo)" stroke="#EEF0FF" stroke-width="2.6" paint-order="stroke"/>
      <rect x="18.4" y="21.6" width="27.2" height="9.8" rx="4.9" fill="#14153F"/>
      <path d="M 22.5 24.2 H 33" stroke="#FFFFFF" stroke-width="0.9" stroke-linecap="round" opacity="0.3"/>
      <circle cx="40" cy="26.5" r="2.9" fill="#6ECC64" filter="url(#luz)"/>
      <g transform="rotate(-14 32 40)">
        <path d="M 7,40 A 25,8 0 0,0 57,40" fill="none" stroke="url(#anel)" stroke-width="2.8" stroke-linecap="round"/>
        <circle cx="51.5" cy="44.9" r="3.2" fill="#9BE88F" stroke="#EEF0FF" stroke-width="1.4" paint-order="stroke" filter="url(#luz)"/>
      </g>
    </g>
  </g>
</svg>
