# Catálogo do banco de negócio (ADR-0006).
#
# Este arquivo é a parte lida por máquina: o sql_guard decide com ele o que
# pode rodar. As consultas de referência e as regras de negócio ficam em
# ../../chatbot_bi_referencia_querys.md, mantido pelo time de BI, e não são
# copiadas para cá — um só lugar, sem cópia para divergir (O-10).
#
# A permissão é por SCHEMA: são os schemas que o documento de referência
# declara. O que protege o dado sensível é a lista de colunas bloqueadas
# abaixo e, no banco, o GRANT do usuário bi_chatbot_ro (D-01).

versao: 2

schemas_permitidos:
  - audit
  - cddd
  - td
  - tdd
  - pbm
  - estoque_redes
  # Área Médica e Email MKT, sincronizados todo dia (ADR-0032). Escrito pela
  # role jarvis_mkt_sync; o bi_chatbot_ro só lê.
  - marketing

# Previstos, mas ainda não criados no banco (2026-09-16). Ficam liberados no
# validador para a consulta rodar e o banco responder que o objeto não existe
# — o que vira "essa informação ainda não está disponível". O catalog_check
# avisa sem falhar. Quando o schema for criado, mova para a lista de cima e
# peça o GRANT (infra/rds/02_criar_usuario_leitura.sql).
schemas_futuros:
  - remuneracao_fv  # metas dos representantes

tabelas_bloqueadas:
  - objeto: pbm.fato_pbm_adesoes_stg
    motivo: >-
      Tabela de staging, com o dado bruto da carga. Use pbm.fato_pbm_adesoes,
      que tem as mesmas colunas já tratadas.
  - objeto: pbm.fato_pbm_transacoes_stg
    motivo: >-
      Tabela de staging, com o dado bruto da carga. Use pbm.fato_pbm_transacoes,
      que tem as mesmas colunas já tratadas.

# Nenhuma coluna bloqueada (decisão do Rubens, 2026-09-30, O-02): dado de
# pessoa física — consumidor do PBM, CPF e contato de médico, contatos dos
# cadastros de PDV — pode ser consultado e compartilhado quando pedido. Até
# essa data, 64 colunas pessoais ficavam fora das consultas e do snapshot.
# O mecanismo continua valendo: para bloquear de novo, basta listar aqui
# (tabela: {colunas: [...], motivo: ...}) e regerar o snapshot.
colunas_bloqueadas: {}

# Função administrativa não tem uso em pergunta de negócio, e algumas são
# caminho para ler arquivo, abrir conexão ou segurar a sessão.
funcoes_bloqueadas:
  - pg_sleep
  - pg_read_file
  - pg_read_binary_file
  - pg_ls_dir
  - pg_stat_file
  - pg_terminate_backend
  - pg_cancel_backend
  - pg_reload_conf
  - set_config
  - current_setting
  - query_to_xml
  - dblink
  - dblink_exec

prefixos_de_funcao_bloqueados:
  - pg_
  - dblink
  - lo_

limites:
  # Padrões propostos em docs/open-decisions.md (O-06).
  max_linhas: 500
  # 60 s desde 2026-10-01 (O-06). Com 15 s, a análise de diretor do Fernando
  # (as 3 piores quedas de CDD x market share do TD) estourou duas vezes —
  # medidas depois, as consultas levavam 20 e 21 s. No histórico dele, as
  # outras 18 rodaram em 0,3 a 6,4 s. O "Baixar Excel" refaz a consulta na
  # requisição web: o gunicorn tem 120 s (Dockerfile) para caber a consulta
  # e a montagem do arquivo.
  timeout_ms: 60000
  linhas_para_o_modelo: 50

# As regras de negócio (unidades ×1000, filtros do Sell Out, grupos do TDD)
# estão no documento de referência. Aqui só o que não está lá.
dicionario: []
