  # ------------------------------------------------------------------
  # Perguntas que cruzam áreas — frequentes no dia a dia (ADR-0015).
  # Não têm gabarito único: mais de um caminho correto devolve linhas
  # diferentes. O que se confere é se a IA trouxe as regras das DUAS
  # áreas na mesma consulta.
  # ------------------------------------------------------------------
  - id: Z-prescricao-e-cdd-territorio
    grupo: cruzado
    pergunta: No território do Hermes, quanto prescreveram e quanto foi dispensado em unidades no primeiro semestre de 2026?
    esperado: [answer_with_data, clarify]
    sql_deve_conter:
      - "prescricao"
      - "fato_cdd"
      - ["desc_canal<>'hospitalar'", "desc_canal!='hospitalar'"]
      - ["/1000.0", "/1000"]
      - "forca_vendas"
    comparar_resultado: false
    nota: >-
      Cruza prescrição (audit) com dispensação (cddd) pelo território. As duas áreas têm
      regras próprias, e os filtros padrão do CDD continuam obrigatórios.

  - id: Z-share-e-visitas-representante
    grupo: cruzado
    pergunta: Qual o market share da Ease no varejo no território da Marta e quantas visitas efetivas ela fez em agosto de 2026?
    esperado: [answer_with_data, clarify]
    sql_deve_conter:
      - "fato_td"
      - "rx_visitas"
      - "visita_efetiva='s'"
      - ["desc_canal<>'hospitalar'", "desc_canal!='hospitalar'"]
    comparar_resultado: false
    nota: Cruza mercado (td) com visitas (audit); o varejo exclui hospitalar e a visita precisa ser efetiva.

  - id: Z-painel-e-pbm
    grupo: cruzado
    pergunta: Os médicos do painel do Josias geraram quantas adesões no PBM em 2026?
    esperado: [answer_with_data, clarify]
    sql_deve_conter:
      - "rx_cadastro_mais_recente"
      - "fato_pbm_adesoes"
      - ["lpad(", "crm_link"]
    comparar_resultado: false
    nota: >-
      Cruza painel (audit) com PBM (pbm). O CRM do PBM é montado de UF_PROFISSIONAL +
      COD_PROFISSIONAL com zeros à esquerda; sem isso o cruzamento volta vazio.

  - id: Z-categoria-e-estoque-uf
    grupo: cruzado
    pergunta: Em São Paulo, os PDVs categoria 1 e 2 de faturamento do mercado estão com estoque de Extrato na última carga?
    esperado: answer_with_data
    referencia: C33
    parametros: {ean: "7896806601250"}
    trocas:
      - de: 'f."CAT_R$_MERCADO" BETWEEN 1 AND 3'
        para: 'f."CAT_R$_MERCADO" BETWEEN 1 AND 2 AND d."UF_PDV" = ''SP'''
      - de: "AND e.estoque_qtde <= 0"
        para: ""
    sql_deve_conter: ["vw_estoque_cd_recente", "fato_tdd", "'sp'"]
    comparar_resultado: false
    nota: Cruza categoria de PDV (tdd) com estoque (estoque_redes) pelo CNPJ preenchido com zeros.

  - id: Z-prescricao-sem-venda
    grupo: cruzado
    pergunta: Quais médicos do painel do setor 1314 prescreveram Ease em 2026 mas não tiveram nenhuma dispensação no brick deles?
    esperado: [answer_with_data, clarify, unknown]
    sql_deve_conter: ["prescricao", ["fato_cdd", "vw_sell_out"]]
    comparar_resultado: false
    nota: >-
      Pergunta difícil de propósito: prescrição é por médico e dispensação é por PDV, então
      o cruzamento só existe pelo brick. A IA pode responder com a ressalva ou explicar o
      limite — o que não pode é somar as duas como se fossem a mesma unidade.
