  # ------------------------------------------------------------------
  # 2.2 Sell Out Ease PDVs (CDD)
  # ------------------------------------------------------------------
  - id: B10-cdd-12m
    grupo: referencia
    pergunta: Quantas unidades CDD a Ease dispensou por mês de setembro de 2025 a agosto de 2026?
    esperado: answer_with_data
