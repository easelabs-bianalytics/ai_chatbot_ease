      - de: "AND dc_1.desc_canal <> 'HOSPITALAR'"
        para: "AND dc_1.desc_canal <> 'HOSPITALAR' AND fc.cod_anomes >= '2025-09-01' AND fc.cod_anomes < '2026-09-01'"

  - id: B11-paguemenos-2026
    grupo: referencia
    pergunta: Quantas unidades a Pague Menos dispensou por mês em 2026?
    esperado: answer_with_data
    referencia: B11
    parametros: {rede: PAGUE MENOS}
