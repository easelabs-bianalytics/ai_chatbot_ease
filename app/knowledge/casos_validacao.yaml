# Casos de validação da IA (Fase 7) — derivados de chatbot_bi_referencia_querys.md
#
# Cada caso é uma pergunta de usuário que NÃO é a pergunta de exemplo do
# documento: troca período, recorte, produto, rede, representante ou
# granularidade, para testar se a IA interpreta o pedido e adapta a
# referência em vez de copiá-la.
#
# Campos:
#   id, grupo, pergunta, esperado      obrigatórios
#   referencia                          consulta do documento que serve de base
#   parametros                          valores para os :parametros da referência
#   trocas                              trechos da referência trocados para montar o gabarito
#                                       (se o trecho sumir do documento, a suíte avisa)
#   antes                               perguntas anteriores da mesma conversa
#   sql_deve_conter / sql_nao_deve_conter
#                                       regras sobre o SQL da IA; texto comparado sem espaços,
#                                       sem caixa e sem alias (lista = basta uma alternativa)
#   resposta_deve_conter                texto que a resposta precisa mencionar
#   comparar_resultado                  false quando mais de uma forma correta de responder
#                                       devolve linhas diferentes (vira revisão manual)
#   esperado: answer_with_data | clarify | unknown | out_of_scope | indisponivel
#
# Valores (CRM, CNPJ, CD, setor, brick) foram tirados do banco real em
# 2026-09-16, para que os gabaritos devolvam linhas.

hoje: "2026-09-16"

# Regras de negócio do documento que valem para toda consulta daquele tema.
regras:
  - nome: Sell Out Ease Total vem da vw_sell_out, com a fórmula do documento
    referencias: [B01, B02, B03, B04]
    sql_deve_conter: ["vw_sell_out", "cdd+extras+mp+ss-pbm"]
    sql_nao_deve_conter: ["fato_cdd"]
  - nome: arredondamento do Sell Out Total (parte decimal acima de 0,89)
    referencias: [B01, B02, B03]
    sql_deve_conter: ["0.89"]
  - nome: ticket médio para faturamento Ease
    referencias: [B04]
    sql_deve_conter: ["302", "799.3", "174.3", "286"]
  - nome: vendas extras e Mercado Público ignoram exclusão lógica
    referencias: [B07, B08, B09]
    sql_deve_conter: ["deleted_atisnull"]
  - nome: filtros padrão do Sell Out CDD
    referencias: [B10, B11, B12, B13, B14, B16]
    sql_deve_conter:
      - "fato_cdd"
      - "cod_tipo_transacao='1'"
      - "similarto'%(dimed|ls|portal|farmaciasassociadas)%'"
      - ["desc_canal<>'hospitalar'", "desc_canal!='hospitalar'"]
      - ["/1000.0", "/1000"]
    sql_nao_deve_conter: ["vw_sell_out"]
  - nome: filtros padrão do Sell Out CDD (janela de 90 dias)
    referencias: [B15]
    sql_deve_conter:
      - "fato_cdd"
      - "cod_tipo_transacao='1'"
      - ["desc_canal<>'hospitalar'", "desc_canal!='hospitalar'"]
      - ["/1000.0", "/1000"]
      - "max(cod_anomes)"
  - nome: mercado TD dividido por 1000
    referencias: [B20, B21, B22, B23, B24, B25, B26, B27, B28, B29, B30]
    sql_deve_conter: ["fato_td", "/1000"]
  - nome: varejo exclui o canal hospitalar
    referencias: [B20, B22, B23, B24, B25, B26, B27, B28, B29, B30]
    sql_deve_conter: [["desc_canal<>'hospitalar'", "desc_canal!='hospitalar'"]]
  - nome: laboratório do mercado pela cadeia apres → prod → fab
    referencias: [B24, B25, B26, B27, B28, B29, B30]
    sql_deve_conter: ["fab"]
  - nome: último trimestre = 3 últimos meses da base, não de hoje
    referencias: [B25, B30]
    sql_deve_conter: ["max(cod_anomes)"]
  - nome: estoque atual vem da carga mais recente
    referencias: [C01, C02, C03, C04, C05, C06, C07]
    sql_deve_conter: ["vw_estoque_cd_recente"]
  - nome: estoque de loja filtra tipo PDV
    referencias: [C02, C04, C06, C07, C11]
    sql_deve_conter: ["tipo='pdv'"]
  - nome: estoque de CD filtra tipo CD
    referencias: [C05, C12]
    sql_deve_conter: ["tipo='cd'"]
  - nome: histórico de estoque vem da tabela de cargas
    referencias: [C10, C11, C12]
    sql_deve_conter: ["estoque_redes_cd"]
    sql_nao_deve_conter: ["vw_estoque_cd_recente"]
  - nome: ruptura é dia 0 e DDE até 15
    referencias: [C20, C21, C22]
    sql_deve_conter: ["vw_forecast_projecao_cd", "dia=0", "dde_base<=15"]
  - nome: categoria de PDV sai do TDD com a coluna de categoria de mercado
    referencias: [C30, C31, C32, C33, C34, C35]
    sql_deve_conter: ["fato_tdd", "\"cod_grupo\"", ["\"cat_r$_mercado\"", "\"cat_un_mercado\""]]
  - nome: SEM CAT não é descartado (PDV)
    referencias: [C30, C31, C34, C35]
    sql_deve_conter: ["'semcat'", "leftjoin"]
  - nome: SEM CAT não é descartado (médico)
    referencias: [A09]
    sql_deve_conter: ["'semcat'", "leftjoin"]
  - nome: PDVs de uma rede pela raiz do CNPJ, não pelo nome
    referencias: [C34, C35]
    sql_deve_conter: ["left(lpad("]
  - nome: prescrição liga produto pela chave composta com cast da forma
    referencias: [A02, A03]
    sql_deve_conter: ["cdgforma::text"]
  - nome: transação PBM válida é a confirmada, descontada a devolução
    referencias: [D10, D11, D12, D13, D14]
    sql_deve_conter: ["\"status_trn\"='confirmada'", "\"qtde_devolvida\""]
  - nome: desconto do PBM convertido para número
    referencias: [D11, D12]
    sql_deve_conter: ["\"desc_adm\"::numeric"]
  - nome: ranking de médico exclui profissional não informado
    referencias: [D02, D03, D14]
    sql_deve_conter: [["\"cod_profissional\"<>0", "\"cod_profissional\"<>'0'", "\"cod_profissional\"!=0", "\"cod_profissional\"!='0'"]]
  - nome: pacientes contados pelo ID do consumidor
    referencias: [D01, D03, D05]
    sql_deve_conter: ["\"id_consumidor\""]
  - nome: voucher é a coluna pbm da vw_sell_out
    referencias: [D20, D21, D22, D23]
    sql_deve_conter: ["vw_sell_out", "pbm"]
    sql_nao_deve_conter: ["fato_pbm_transacoes"]
  - nome: visita conta só a efetiva
    referencias: [A12, E05, E06, E20, E21, E22, E23, E24, E26]
    sql_deve_conter: ["visita_efetiva='s'"]
  - nome: tentativa sem contato é a visita não efetiva
    referencias: [E25]
    sql_deve_conter: ["visita_efetiva='n'"]
  - nome: Visitação Remota é o setor 3000
    referencias: [E21, E22, E26]
    sql_deve_conter: ["3000"]

casos:
  # ------------------------------------------------------------------
  # 1. Auditoria e prescrição
  # ------------------------------------------------------------------
  - id: A01-ease-1sem26
    grupo: referencia
    pergunta: Quantas prescrições a Ease teve por mês no primeiro semestre de 2026?
    esperado: answer_with_data
    referencia: A01
    trocas:
      - de: "-- WHERE p.cdglaboratorio = 'EAS'"
        para: "WHERE p.cdglaboratorio = 'EAS' AND p.data >= '2026-01-01' AND p.data < '2026-07-01' --"
    sql_deve_conter: ["cdglaboratorio='eas'"]

  - id: A01-mercado-2025
    grupo: referencia
    pergunta: Qual foi o volume de prescrição do mercado de cannabis, mês a mês, em 2025?
    esperado: answer_with_data
    referencia: A01
    trocas:
      - de: "-- WHERE p.cdglaboratorio = 'EAS'"
        para: "WHERE p.data >= '2025-01-01' AND p.data < '2026-01-01' --"
    sql_nao_deve_conter: ["cdglaboratorio='eas'"]
    nota: Mercado inteiro — a IA não pode filtrar a Ease.

  - id: A02-prati-2026
    grupo: referencia
    pergunta: Como foi a prescrição de cada produto da Prati-Donaduzzi, mês a mês, em 2026?
    esperado: answer_with_data
    referencia: A02
    trocas:
      - de: "p.cdglaboratorio = 'EAS'"
        para: "p.cdglaboratorio = 'P.D' AND p.data >= '2026-01-01'"
    sql_deve_conter: ["cdglaboratorio='p.d'"]
    nota: Troca de laboratório; o código P.D está em audit.laboratorio.

  - id: A03-isolado-mar-ago26
    grupo: referencia
    pergunta: Quantas prescrições de Isolado a Ease teve mês a mês, de março a agosto de 2026?
    esperado: answer_with_data
    referencia: A03
    trocas:
      - de: "r.descmole = 'EXTRATO CANNABIS SATIVA'"
        para: "r.descmole = 'CANABIDIOL' AND p.data BETWEEN '2026-03-01' AND '2026-08-01'"
    sql_deve_conter: ["descmole='canabidiol'"]

  - id: A04-share-2025
    grupo: referencia
    pergunta: Qual foi o share da Ease na prescrição de cannabis em cada mês de 2025?
    esperado: answer_with_data
    referencia: A04
    parametros: {data_ini: "2025-01-01", data_fim: "2025-12-01"}
    sql_deve_conter: ["nullif"]

  - id: A05-brick-1sem26
    grupo: referencia
    pergunta: Quais médicos prescreveram Ease no brick 31067050012 no primeiro semestre de 2026?
    esperado: answer_with_data
    referencia: A05
    parametros: {data_ini: "2026-01-01", data_fim: "2026-06-01", cod_utc: 31067050012}

  - id: A06-psiquiatria-2026
    grupo: referencia
    pergunta: Como evoluiu a prescrição Ease da psiquiatria mês a mês em 2026?
    esperado: answer_with_data
    referencia: A06
    parametros: {especialidade: PSIQUIATRIA}
    trocas:
      - de: "AND p.cdglaboratorio = 'EAS'"
        para: "AND p.cdglaboratorio = 'EAS' AND p.data >= '2026-01-01'"

  - id: A07-greencare-2026
    grupo: referencia
    pergunta: Quantos médicos prescreveram Greencare por mês em 2026?
    esperado: answer_with_data
    referencia: A07
    trocas:
      - de: "p.cdglaboratorio = 'EAS'"
        para: "p.cdglaboratorio = 'GRE' AND p.data >= '2026-01-01'"
    sql_deve_conter: ["count(distinct"]

  - id: A08-percapita-6m
    grupo: referencia
    pergunta: Qual o RX per capita da Ease nos últimos 6 meses?
    esperado: answer_with_data
    referencia: A08
    trocas:
      - de: "AND p.px1 > 0"
        para: "AND p.px1 > 0 AND p.data >= '2026-03-01'"
    nota: Hoje é 16/09/2026 e a última competência é ago/26, então 6 meses = mar a ago/26.

  - id: A09-categoria-semestre
    grupo: referencia
    pergunta: Qual a categoria do médico MG0052508 no último semestre móvel?
    esperado: answer_with_data
    referencia: A09
    parametros: {crm: MG0052508}
    trocas:
      - de: "audit.vw_cat_ult_trim_movel"
        para: "audit.vw_cat_ult_sem_movel"
      - de: "c.px_3m"
        para: "c.px_6m"
    sql_deve_conter: ["vw_cat_ult_sem_movel"]
    nota: Outro período de categoria exige outra view (e a coluna de volume muda de nome).

  - id: A10-cat1a2-2026
    grupo: referencia
    pergunta: Como evoluiu a prescrição Ease mensal dos médicos categoria 1 e 2 do último trimestre móvel, de janeiro a agosto de 2026?
    esperado: answer_with_data
    referencia: A10
    parametros: {data_ini: "2026-01-01", data_fim: "2026-08-01"}
    trocas:
      - de: "BETWEEN 1 AND 3"
        para: "BETWEEN 1 AND 2"

  - id: A11-painel-medico
    grupo: referencia
    pergunta: O médico GO0004231 está sendo visitado?
    esperado: answer_with_data
    referencia: A11
    parametros: {crm: GO0004231}
    sql_deve_conter: ["rx_cadastro_mais_recente"]

  - id: A12-visitas-setor-2712
    grupo: referencia
    pergunta: Quais as últimas visitas do painel do setor 2712?
    esperado: answer_with_data
    referencia: A12
    trocas:
      - de: "v.setor = 1111"
        para: "v.setor = 2712"
    sql_deve_conter: ["setor=2712"]

  - id: A13-setor-marta
    grupo: referencia
    pergunta: Qual o setor da Marta?
    esperado: answer_with_data
    referencia: A13
    parametros: {rep: MARTA}
    sql_deve_conter: ["ilike"]

  - id: A14-painel-hermes-2026
    grupo: referencia
    pergunta: Quanto a Ease teve de prescrição no painel do Hermes em 2026, mês a mês?
    esperado: answer_with_data
    referencia: A14
    parametros: {rep: HERMES}
    trocas:
      - de: "AND p.cdglaboratorio = 'EAS'"
        para: "AND p.cdglaboratorio = 'EAS' AND p.data >= '2026-01-01'"
    sql_deve_conter: ["rx_cadastro_mais_recente"]
    nota: O usuário disse "painel", então não precisa perguntar painel ou território.

  - id: A15-territorio-josias-2026
    grupo: referencia
    pergunta: E no território do Josias, qual a prescrição Ease mês a mês em 2026? Considere todos os bricks dele.
    esperado: answer_with_data
    referencia: A15
    parametros: {rep: JOSIAS}
    trocas:
      - de: "AND p.cdglaboratorio = 'EAS'"
        para: "AND p.cdglaboratorio = 'EAS' AND p.data >= '2026-01-01'"
    sql_deve_conter: ["utc_codigo", "cod_utc"]

  - id: A16-gr-juliana
    grupo: referencia
    pergunta: Como evoluiu a prescrição Ease mensal dos médicos categoria 1 a 3 do painel da equipe da Juliana entre março e agosto de 2026?
    esperado: answer_with_data
    referencia: A16
    parametros: {gr: JULIANA, data_ini: "2026-03-01", data_fim: "2026-08-01"}
    sql_deve_conter: ["fv_distrito"]

  - id: A17-cidades-2tri26
    grupo: referencia
    pergunta: Em quais cidades estão as prescrições Ease no segundo trimestre de 2026?
    esperado: answer_with_data
    referencia: A17
    parametros: {data_ini: "2026-04-01", data_fim: "2026-06-01"}
    sql_deve_conter: ["utc"]

  - id: A18-top5-cidades-marta
    grupo: referencia
    pergunta: Quais as 5 cidades com mais PX Ease no território da Marta Eloisa no último trimestre?
    esperado: answer_with_data
    referencia: A18
    trocas:
      - de: "'%HERMES%'"
        para: "'%MARTA%'"
      - de: "LIMIT 10"
        para: "LIMIT 5"
    sql_deve_conter: ["limit5", "max(data)"]
    nota: Último trimestre = 3 competências mais recentes da base, não os 3 meses antes de hoje.

  - id: A21-painel-e-territorio-marta
    grupo: referencia
    pergunta: Quero a PX Ease da Marta Eloisa mês a mês em 2026, tanto do painel quanto do território, as duas.
    esperado: answer_with_data
    referencia: A21
    parametros: {rep: "MARTA"}
    trocas:
      - de: "AND p.cdglaboratorio = 'EAS'"
        para: "AND p.cdglaboratorio = 'EAS' AND p.data >= '2026-01-01'"
    sql_deve_conter: ["unionall", "rx_cadastro_mais_recente", "utc_codigo"]
    nota: >-
      As duas visões foram pedidas: nada de clarify e nada de somar. O painel está dentro do
      território, então a resposta traz cada uma com o seu número.

  - id: A19-px-extrato-laboratorio
    grupo: referencia
    pergunta: Quantas prescrições de Extrato cada laboratório teve no último MAT, com o share de PX?
    esperado: answer_with_data
    referencia: A19
    trocas:
      - de: "r.descmole = 'CANABIDIOL'"
        para: "r.descmole = 'EXTRATO CANNABIS SATIVA'"
    sql_deve_conter: ["extratocannabissativa"]
    nota: Classe na auditoria é molécula (descmole), não a regra do nome do mercado.

  - id: A19-px-isolados-por-produto
    grupo: referencia
    pergunta: Quais produtos Isolados foram mais prescritos no último MAT? Quero o share de PX de cada um.
    esperado: answer_with_data
    referencia: A19
    comparar_resultado: false
    sql_deve_conter: ["audit.produto", "canabidiol"]
    nota: >-
      O exemplo do "mindset" do preâmbulo: não há consulta pronta. A IA precisa levar a B33 (lista
      da classe com share, no mercado) para a auditoria, partindo da A19 e trocando o agrupamento
      de laboratório para audit.produto.nome. Deve avisar que a prescrição não separa por frasco.
      Conferido no RDS em 23/09/2026: 34 produtos, 370,9 mil PX, Ease 100 mg/mL em 4º (8,49%).

  - id: A20-conversao-extrato
    grupo: referencia
    pergunta: Quantas unidades de Extrato da Ease saem por prescrição no MAT?
    esperado: answer_with_data
    referencia: A20
    trocas:
      - de: "r.descmole = 'CANABIDIOL'"
        para: "r.descmole = 'EXTRATO CANNABIS SATIVA'"
      - de: "(234194, 254655, 309653)"
        para: "(259434)"
    sql_deve_conter: ["vw_sell_out", "259434"]
    nota: Mesma classe e mesmo período nos dois lados; é proporção, não rastreio receita a receita.

  # ------------------------------------------------------------------
  # 2.1 Sell Out Ease Total
  # ------------------------------------------------------------------
  - id: B01-total-jan-ago26
    grupo: referencia
    pergunta: Quantas unidades Ease foram vendidas no total, mês a mês, de janeiro a agosto de 2026?
    esperado: answer_with_data
    referencia: B01
    trocas:
      - de: "FROM cddd.vw_sell_out s"
        para: "FROM cddd.vw_sell_out s WHERE s.date >= '2026-01-01' AND s.date < '2026-09-01'"
    colunas_do_gabarito: [mes, total]
    nota: >-
      A referência abre os componentes (CDD, extras, MP, SS, voucher); a pergunta é pelo
      total, então a comparação olha só mês e total.

  - id: B02-reps-ago26
    grupo: referencia
    pergunta: Quantas unidades vendeu cada representante em agosto de 2026?
    esperado: answer_with_data
    referencia: B02
    parametros: {data_ini: "2026-08-01", data_fim: "2026-09-01"}

  - id: B02-hermes-jul26
    grupo: referencia
    pergunta: Quanto o Hermes vendeu em julho de 2026?
    esperado: answer_with_data
    referencia: B02
    parametros: {data_ini: "2026-07-01", data_fim: "2026-08-01"}
