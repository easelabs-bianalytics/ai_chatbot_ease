      - de: "-- AND s.nome_abreviado_ct ILIKE '%' || :rep || '%'"
        para: "AND s.nome_abreviado_ct ILIKE '%HERMES%' --"
    sql_deve_conter: ["ilike'%hermes%'"]
    nota: '"Quanto o representante vendeu" é Sell Out Ease Total, não CDD.'

